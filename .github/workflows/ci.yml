name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          
      - name: Get package list
        id: packages
        run: |
          packages=$(pnpm list --json --depth=0 | jq -r '.[] | select(.path != ".") | .path | split("/")[-1]')
          echo "packages=$(echo $packages | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run linting
        run: pnpm lint
        
      - name: Check formatting
        run: pnpm prettier --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          
      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Type check
        run: pnpm type-check

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build packages
        run: pnpm build
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            packages/*/dist
            packages/*/lib
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        node-version: [18, 20, 21, 24]
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          
      - name: Run tests
        run: pnpm test --coverage
        
      - name: Upload coverage
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          
      - name: Run integration tests
        run: |
          cd examples/basic-project
          pnpm install
          pnpm test
          
          cd ../complex-project
          pnpm install
          pnpm test