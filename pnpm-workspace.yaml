packages:
  - 'packages/*'
  - 'examples/*'
  - 'tools/*'

# Shared dependencies
sharedWorkspaceLockfile: true

# Dependency overrides for consistency
dependencyOverrides:
  typescript: ^5.9.3
  "@types/node": ^25.1.0

# Publishing configuration
publishConfig:
  registry: https://registry.npmjs.org/
  access: public